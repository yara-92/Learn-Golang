{{ define "main" }}
<article class="single-post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    {{ if not .Date.IsZero }}
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年01月02日" }}</time>
      {{ with .Params.categories }}
        {{ range . }}<span class="category">{{ . }}</span>{{ end }}
      {{ end }}
    </div>
    {{ end }}
  </header>

  <div class="content">
    {{ .Content }}
  </div>

  {{ with .Params.tags }}
  <div class="tags">
    {{ range . }}<span class="tag">#{{ . }}</span>{{ end }}
  </div>
  {{ end }}
</article>
{{ end }}
