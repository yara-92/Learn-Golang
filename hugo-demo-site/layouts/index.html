{{ define "main" }}
<section class="hero">
  <h1>{{ .Site.Title }}</h1>
  <div class="content">
    {{ .Content }}
  </div>
</section>

<section class="recent-posts">
  <h2>最新文章</h2>
  <ul class="post-list">
    {{ range first 5 (where .Site.RegularPages "Type" "posts") }}
    <li class="post-item">
      <a class="post-item-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
      <span class="post-item-date">{{ .Date.Format "2006-01-02" }}</span>
      {{ if .Description }}<p class="post-item-desc">{{ .Description }}</p>{{ end }}
    </li>
    {{ end }}
  </ul>
  <a class="more-link" href="{{ "/posts/" | relURL }}">查看全部文章 →</a>
</section>
{{ end }}
